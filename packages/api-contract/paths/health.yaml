health:
  get:
    operationId: getHealth
    tags: [health]
    summary: Readiness — application and database.
    description: Used as the App Service health check path. Returns 503 when the database is not reachable within the timeout. Never exposes version, hostname or environment.
    security: []
    responses:
      '200':
        description: Application and database are ready.
        headers:
          X-Request-ID:
            $ref: ../components/headers/common.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/HealthResponse
      '503':
        description: Database not ready.
        headers:
          X-Request-ID:
            $ref: ../components/headers/common.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/HealthResponse

health-live:
  get:
    operationId: getLiveness
    tags: [health]
    summary: Liveness — process is up (no dependency checks).
    security: []
    responses:
      '200':
        description: Process is alive.
        headers:
          X-Request-ID:
            $ref: ../components/headers/common.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/health.yaml#/HealthResponse
