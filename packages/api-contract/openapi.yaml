openapi: 3.1.0
info:
  title: EduCenter Cloud API
  version: 0.0.1
  description: |
    Contract-first API for EduCenter Cloud (ROADMAP §7.5).

    Conventions (V2 §14, ROADMAP §7.3, D-12):
    - Base path `/api/v1`; plural nouns; JSON only.
    - Every response carries a server-generated `X-Request-ID` header.
    - Errors use `ErrorResponse` `{ code, message, requestId, fieldErrors? }`; no stack traces or DB details.
    - Money (VND) is `MoneyVnd`: BIGINT in the database, serialized as a decimal **string**.
    - Date-times are UTC ISO-8601 (`format: date-time`).
    - Pagination: `?page` (>= 1) and `?pageSize` (1..100).
    - Mutations with replay risk accept an `Idempotency-Key` header (D-13).
    - Each module owns exactly one `paths/<module>.yaml` file.
servers:
  - url: /api/v1
tags:
  - name: health
    description: Liveness and readiness probes.
security: []
paths:
  /health:
    $ref: ./paths/health.yaml#/health
  /health/live:
    $ref: ./paths/health.yaml#/health-live
components:
  schemas:
    ErrorCode:
      $ref: ./components/schemas/common.yaml#/ErrorCode
    ErrorResponse:
      $ref: ./components/schemas/common.yaml#/ErrorResponse
    FieldError:
      $ref: ./components/schemas/common.yaml#/FieldError
    MoneyVnd:
      $ref: ./components/schemas/common.yaml#/MoneyVnd
    PageMeta:
      $ref: ./components/schemas/common.yaml#/PageMeta
    HealthResponse:
      $ref: ./components/schemas/health.yaml#/HealthResponse
  parameters:
    Page:
      $ref: ./components/parameters/common.yaml#/Page
    PageSize:
      $ref: ./components/parameters/common.yaml#/PageSize
    IdempotencyKey:
      $ref: ./components/parameters/common.yaml#/IdempotencyKey
  headers:
    RequestId:
      $ref: ./components/headers/common.yaml#/RequestId
  responses:
    ValidationFailed:
      $ref: ./components/responses/common.yaml#/ValidationFailed
    InternalError:
      $ref: ./components/responses/common.yaml#/InternalError
