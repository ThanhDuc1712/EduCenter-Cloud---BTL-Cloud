Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: pageSize
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  description: Client-generated key (UUID) for safely retrying risky mutations (D-13).
  schema:
    type: string
    format: uuid
