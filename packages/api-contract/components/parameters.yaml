# Parameter dùng chung — owner: TV1 (Đức).

Page:
  name: page
  in: query
  required: false
  description: Số trang, bắt đầu từ 1.
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: pageSize
  in: query
  required: false
  description: Số bản ghi mỗi trang. Tối đa 100; vượt → 400 `VALIDATION_FAILED`.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Khóa chống lặp do client sinh cho mỗi thao tác (UUID). Chỉ áp dụng cho
    `POST /invoices/{id}/payments` và `POST /classrooms/{id}/enrollments` (D-13).
    Cùng key + cùng body → trả lại response cũ; cùng key + body khác → 409.
  schema:
    type: string
    format: uuid
