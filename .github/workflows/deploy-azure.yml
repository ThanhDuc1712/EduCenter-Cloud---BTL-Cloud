# CD Azure (P0-12, D-02, D-25): build once -> approval (environment "demo") -> migrate -> deploy -> smoke test.
# environment "demo" (infra/azure/main.bicep), read-only token by default, actions pinned to commit SHAs.
name: Deploy Azure (demo)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, tag or branch to deploy (empty = main). Use an older SHA to roll back.'
        required: false
        default: ''
      migrate:
        description: 'Run prisma migrate deploy before deploying'
        type: boolean
        default: true

permissions:
  contents: read

# Never run two deployments to the same environment at once; never cancel one halfway.
concurrency:
  group: deploy-azure-demo
  cancel-in-progress: false

jobs:
  build:
    name: Build package (once)
    # Automatic run: only when CI passed for a push to main (not for a PR run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Built on Linux = same platform as App Service Linux (native modules, Prisma).
      - name: Package API + SPA
        run: bash scripts/ci/package-azure.sh "$RUNNER_TEMP/educenter-app.zip"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: educenter-app-${{ steps.rev.outputs.sha }}
          path: ${{ runner.temp }}/educenter-app.zip
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Migrate + deploy + smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Must be "demo": the federated credential subject is repo:<owner/repo>:environment:demo.
    # Add required reviewers to this environment to get the approval gate.
    environment:
      name: demo
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    env:
      SHA: ${{ needs.build.outputs.sha }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      SUFFIX: ${{ vars.EDU_SUFFIX }}
      MIGRATE: ${{ github.event_name != 'workflow_dispatch' || inputs.migrate }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in RG SUFFIX; do
            if [ -z "${!v}" ]; then echo "::error::Variable for $v is empty - see docs/ci-cd.md (environment demo)"; missing=1; fi
          done
          exit $missing

      - name: Checkout (migrations)
        if: env.MIGRATE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        if: env.MIGRATE == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: env.MIGRATE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        if: env.MIGRATE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: educenter-app-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/pkg

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # D-25: no 0.0.0.0 rule; open the database only to this runner's IP, for this run only.
      - name: Open temporary PostgreSQL firewall rule
        id: fw
        if: env.MIGRATE == 'true'
        run: |
          ip="$(curl -sSf --max-time 10 https://api.ipify.org)"
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then echo "::error::Could not get the runner public IP"; exit 1; fi
          rule="gh-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az postgres flexible-server firewall-rule create -g "$RG" --server-name "pg-educenter-$SUFFIX" \
            --name "$rule" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
          echo "Temporary rule $rule created"

      - name: Migrate (prisma migrate deploy as edu_migrator)
        if: env.MIGRATE == 'true'
        run: |
          url="$(az keyvault secret show --vault-name "kv-edu-ops-$SUFFIX" -n db-migrator-url --query value -o tsv)"
          if [ -z "$url" ]; then echo "::error::db-migrator-url not found in kv-edu-ops-$SUFFIX (run infra/azure/scripts/bootstrap_db.py)"; exit 1; fi
          echo "::add-mask::$url"
          MIGRATION_DATABASE_URL="$url" pnpm --filter api prisma:deploy

      # Always runs, even if the migration failed or the job was cancelled.
      - name: Remove temporary firewall rule
        if: always() && steps.fw.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete -g "$RG" --server-name "pg-educenter-$SUFFIX" \
            --name "${{ steps.fw.outputs.rule }}" --yes -o none
          echo "Temporary rule removed"

      # --async: F1 starts slowly and the synchronous call can time out; the smoke test below waits instead.
      - name: Deploy package to App Service
        run: |
          az webapp deploy -g "$RG" -n "app-educenter-$SUFFIX" --src-path "$RUNNER_TEMP/pkg/educenter-app.zip" \
            --type zip --restart true --async true -o none

      # Passes only when the NEW build answers: index.html must equal the one in the package
      # and /api/v1/health must report the database up.
      - name: Smoke test
        id: smoke
        run: |
          host="$(az webapp show -g "$RG" -n "app-educenter-$SUFFIX" --query defaultHostName -o tsv)"
          url="https://$host"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          unzip -p "$RUNNER_TEMP/pkg/educenter-app.zip" apps/web/dist/index.html > "$RUNNER_TEMP/expected.html"
          sleep 45
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sSf --max-time 15 -H 'Accept: text/html' "$url/" -o "$RUNNER_TEMP/live.html" \
               && cmp -s "$RUNNER_TEMP/expected.html" "$RUNNER_TEMP/live.html" \
               && curl -sSf --max-time 15 "$url/api/v1/health" | grep -q '"database":"up"'; then
              echo "Healthy: $url (commit $SHA)"
              exit 0
            fi
            echo "Waiting for the new build..."; sleep 15
          done
          echo "::error::Not healthy after 10 minutes. Logs: az webapp log tail -g $RG -n app-educenter-$SUFFIX"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy Azure (demo)"
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Migration | $MIGRATE |"
            echo "| URL | ${{ steps.smoke.outputs.url }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
